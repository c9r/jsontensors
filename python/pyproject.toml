[project]
name = "jsontensors"
version = "0.1.0"
description = "A JSON document with its arrays as tensors in a binary buffer behind it, in place and read as views"
readme = "README.md"
license = "MIT"
keywords = ["json", "tensor", "numpy", "safetensors", "serialization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: File Formats",
    "Topic :: Scientific/Engineering",
]
authors = [
    { name = "Chris Sachs", email = "chris@toolcog.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ml-dtypes>=0.5",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/c9r/jsontensors"
Repository = "https://github.com/c9r/jsontensors"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
